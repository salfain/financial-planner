<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0e1512" />
    <title>Financial Planner sedang offline</title>
    <style>
      :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef7f2;background:#0e1512;color-scheme:dark}*{box-sizing:border-box}body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px}.card{width:min(430px,100%);padding:30px;border:1px solid #294039;border-radius:24px;background:#14211d;box-shadow:0 25px 70px #0005}.mark{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:#63d3b1;color:#08221b;font-weight:900}.eyebrow{display:block;margin-top:22px;color:#63d3b1;font-size:11px;font-weight:800;letter-spacing:.12em}h1{margin:8px 0;font-size:25px;letter-spacing:-.04em}p{margin:0;color:#a6b9b1;font-size:14px;line-height:1.65}button{width:100%;height:45px;margin-top:22px;color:#08221b;border:0;border-radius:11px;background:#63d3b1;font:inherit;font-weight:800;cursor:pointer}small{display:block;margin-top:15px;color:#789188;font-size:11.5px;line-height:1.55}

  </head>
  <body><main class="card"><span class="mark">FP</span><span class="eyebrow">KONEKSI TERPUTUS</span><h1>Financial Planner sedang offline</h1><p>Sambungkan perangkat ke internet untuk membuka data terbaru dari Google Sheets.</p><button onclick="location.reload()">Coba hubungkan kembali</button><small>Demi keamanan, data keuangan dan respons API tidak disimpan pada cache offline.</small></main></body>
